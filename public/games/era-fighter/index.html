"use strict";
/* ============================================================
   时代战机 —— 像素竖屏波次射击 + 增益门二选一
   单文件 / 零外链 / 双击即玩
   ============================================================ */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = 480, H = 854;

/* ---------- 自适应缩放 ---------- */
function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width  = Math.floor(W * s) + "px";
  cv.style.height = Math.floor(H * s) + "px";
}
addEventListener("resize", fit); fit();

/* ---------- 小工具 ---------- */
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const pick = arr=>arr[rndi(0,arr.length-1)];

/* ---------- 音效（WebAudio 合成） ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function beep(freq,dur,type,vol,slide){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||"square"; o.frequency.value=freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.08, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur);
}
function noise(dur,vol){
  const a=ac(); if(!a) return;
  const n=a.sampleRate*dur, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=buf;
  const g=a.createGain(); g.gain.value=vol||0.15;
  s.connect(g); g.connect(a.destination); s.start();
}
const SFX={
  shoot(){ beep(880,0.05,"square",0.02,-500); },
  hit(){ beep(220,0.04,"sawtooth",0.02,-80); },
  boom(){ noise(0.25,0.18); beep(120,0.3,"triangle",0.12,-80); },
  bigboom(){ noise(0.6,0.3); beep(80,0.7,"triangle",0.2,-50); },
  gate(){ beep(523,0.1,"square",0.1); setTimeout(()=>beep(784,0.15,"square",0.1),90); },
  bad(){ beep(200,0.25,"sawtooth",0.12,-120); },
  hurt(){ noise(0.3,0.25); beep(150,0.35,"sawtooth",0.15,-100); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.15,"square",0.1),i*110)); },
};

/* ============================================================
   像素画素材（字符画 → 离屏 canvas）
   . 透明  其它字符查调色板
   ============================================================ */
const PAL={
  W:"#eef6ff", w:"#bcd6f0",          // 白 / 浅蓝灰
  B:"#4aa8ff", b:"#2a6fd4", d:"#173e7a", // 蓝
  D:"#0e2a55",                        // 深藏青
  G:"#8fa3b8", g:"#5c6f85",           // 灰(机身)
  O:"#ff9d2e", o:"#ff6a00",           // 火焰 / 橙
  R:"#e8404a", r:"#a12c34",           // 红(怪)
  P:"#f6a8c0", p:"#c86a86",           // 粉(怪腹)
  K:"#20242e", k:"#3a4150",           // 黑/深灰
  V:"#7dff6a", v:"#2fae4e",           // 绿(小怪)
  Y:"#ffd94a", y:"#d4a017",           // 黄(能量)
  M:"#c86aff", m:"#7a3ac4",           // 紫(Boss)
  S:"#9df3ff", s:"#3ec8e8",           // 冰蓝(高光)
};
// 把字符画渲染到离屏 canvas（每字符1像素，之后按 scale 放大）
function sprite(rows, scale){
  const w=rows[0].length, h=rows.length;
  const c=document.createElement("canvas"); c.width=w*scale; c.height=h*scale;
  const g=c.getContext("2d");
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=rows[y][x]; if(ch==="."||ch===" ")continue;
    g.fillStyle=PAL[ch]||"#fff";
    g.fillRect(x*scale,y*scale,scale,scale);
  }
  return c;
}
// 水平镜像
function mirror(c){
  const m=document.createElement("canvas"); m.width=c.width; m.height=c.height;
  const g=m.getContext("2d"); g.translate(c.width,0); g.scale(-1,1); g.drawImage(c,0,0);
  return m;
}

const PX=3; // 像素放大倍数

/* ---- 玩家：帅气战机（13 宽） ---- */

/* ---- 玩家战机 左倾斜（穿越门/移动姿态） ---- */

  ".KrK.rK.KrK.r",

const IMG={
  ship:  sprite(SHIP_ROWS,PX),
  shipL: sprite(SHIP_L_ROWS,PX),
  mush:  sprite(MUSH_ROWS,PX),
  zomb:  sprite(ZOMB_ROWS,PX),
  boss:  sprite(BOSS_ROWS,PX),
};
IMG.shipR = mirror(IMG.shipL);

/* ============================================================
   游戏状态
   ============================================================ */
let state="menu";           // menu | play | gate | over
let frame=0;
let score=0, best=+(localStorage.getItem("sdzj_best")||0);
let level=1;                // 关卡（每关 4 小波 + 1 Boss）
let waveInLevel=0;          // 当前关第几波 0..4（4=Boss）
let totalWave=0;

const player={
  x:W/2, y:H-120, w:13*PX, h:14*PX,
  speed:0, targetX:W/2, tilt:0,
  fireCd:0, fireGap:26,      // 帧间隔（越小越快）
  atk:20, bullets:1, crit:0.05,
  hp:3, maxHp:3, flash:0,
};

let bullets=[], enemies=[], parts=[], floats=[], gates=[], flames=[];
let shake=0, waveTimer=0, spawnQueue=[], gatePending=false;
let gateTimer=0;

/* ---------- 关卡数值 ---------- */
function waveHp(wv){
  if(wv===4) return Math.floor(420*Math.pow(1.42,level-1)*14);  // Boss
  return Math.floor(420*Math.pow(1.42,level-1)*(1+wv*0.25));
}
function enemyCount(wv){
  if(wv===4) return 1;
  return 4+wv*2+Math.min(8,Math.floor(level*0.8));
}

/* ---------- 生成一波敌人 ---------- */
function spawnWave(){
  const wv=waveInLevel;
  spawnQueue=[];
  if(wv===4){
    spawnQueue.push({type:"boss",x:W/2,y:-140,hp:waveHp(4),maxHp:waveHp(4),r:19*PX,delay:0});
  }else{
    const n=enemyCount(wv);
    for(let i=0;i<n;i++){
      const type=Math.random()<0.65?"mush":"zomb";
      const col=3+((i%4))*((W-6*13*PX)/(4-1)+0); // 稍后随机分布更自然
      spawnQueue.push({type, x:rnd(50,W-50), y:rnd(-380,-50)- (i%3)*90,
        hp:waveHp(wv), maxHp:waveHp(wv), delay:i*14});
    }
  }
}

/* ============================================================
   增益门
   ============================================================ */
const GATE_POOL=[
  {label:"攻速 ×2",  good:true, apply(){player.fireGap=Math.max(6,Math.floor(player.fireGap*0.55));}},
  {label:"攻击 ×2",  good:true, apply(){player.atk=Math.ceil(player.atk*2);}},
  {label:"攻击 ×1.5",good:true, apply(){player.atk=Math.ceil(player.atk*1.5);}},
  {label:"弹道 +1",  good:true, max:true, apply(){player.bullets=Math.min(8,player.bullets+1);}},
  {label:"暴击 +15%",good:true, apply(){player.crit=Math.min(0.8,player.crit+0.15);}},
];
const BAD_POOL=[
  {label:"攻速 ÷2",  good:false, apply(){player.fireGap=Math.min(60,Math.floor(player.fireGap*1.9));}},
  {label:"攻击 ÷2",  good:false, apply(){player.atk=Math.max(5,Math.floor(player.atk*0.55));}},
  {label:"弹道 -1",  good:false, apply(){player.bullets=Math.max(1,player.bullets-1);}},
];
function makeGates(){
  gates=[];
  const badGate = Math.random()<0.28 && level>1; // 偶尔一好一坏
  let a=pick(GATE_POOL);
  if(a.max && player.bullets>=8) a=pick(GATE_POOL.filter(g=>!g.max));
  let b=pick(GATE_POOL.filter(g=>g!==a && (!g.max||player.bullets<8)));
  if(!b) b=pick(BAD_POOL);
  if(badGate){ b=pick(BAD_POOL); }
  // 门从屏幕顶部生成，以和怪物一样的速度向战机方向下压，撞到才触发
  const gw=172, gh=126;
  const vy = 0.7 + level*0.03;   // 与怪物下压速度一致
  gates=[
    {x:W*0.26, y:-170, vy, w:gw, h:gh, def:a, alive:true},
    {x:W*0.74, y:-170, vy, w:gw, h:gh, def:b, alive:true},
  ];
  if(Math.random()<0.5){ gates.reverse(); } // 随机左右
  gateTimer=0;
  state="gate";
}

/* ============================================================
   输入
   ============================================================ */
let pointerDown=false;
function toGameX(e){
  const r=cv.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  return (cx-r.left)/r.width*W;
}
function onMove(e){
  if(state==="menu"||state==="over")return;
  player.targetX=clamp(toGameX(e),30,W-30);
  if(e.touches)e.preventDefault();
}
cv.addEventListener("mousemove",onMove);
cv.addEventListener("mousedown",e=>{pointerDown=true;onMove(e);unlockAudio();});
addEventListener("mouseup",()=>pointerDown=false);
cv.addEventListener("touchstart",e=>{pointerDown=true;onMove(e);unlockAudio();},{passive:false});
cv.addEventListener("touchmove",onMove,{passive:false});
addEventListener("touchend",()=>pointerDown=false);
cv.addEventListener("click",()=>{
  unlockAudio();
  if(state==="menu") startGame();
  else if(state==="over") startGame();
});
function unlockAudio(){ const a=ac(); if(a&&a.state==="suspended")a.resume(); }

/* ============================================================
   逻辑更新
   ============================================================ */
function startGame(){
  state="play";
  score=0; level=1; waveInLevel=0; totalWave=0;
  player.x=player.targetX=W/2;
  player.fireGap=26; player.atk=20; player.bullets=1; player.crit=0.05;
  player.hp=player.maxHp=3; player.flash=0;
  bullets=[];enemies=[];parts=[];floats=[];gates=[];flames=[];
  shake=0; gatePending=false;
  spawnWave();
}

function addFloat(x,y,text,color,size){ floats.push({x,y,text,color,size:size||16,life:40}); }
function boom(x,y,color,n,big){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2), sp=rnd(1,big?7:4);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rndi(15,big?50:32),
      color:color||pick(["#ffd94a","#ff9d2e","#ff6a00","#eef6ff"]),size:rndi(2,big?6:4)});
  }
  shake=Math.max(shake,big?12:4);
}

function updatePlayer(){
  // 移动（缓动跟随）
  const dx=player.targetX-player.x;
  player.x+=dx*0.22;
  player.tilt=clamp(dx*0.045,-1,1);
  // 引擎火焰粒子
  if(frame%2===0){
    flames.push({x:player.x+rnd(-4,4),y:player.y+player.h/2-4,
      vy:rnd(1.5,3),life:rndi(8,16),color:pick(["#ff9d2e","#ff6a00","#ffd94a"])});
  }
  // 自动射击
  if(state!=="gate"&&state!=="over"){
    if(--player.fireCd<=0){
      player.fireCd=player.fireGap;
      const n=player.bullets, spread=n>1?(n-1)*14:0;
      for(let i=0;i<n;i++){
        const ox=n===1?0:(i*spread/(n-1)-(spread/2));
        bullets.push({x:player.x+ox,y:player.y-player.h/2,
          vy:-11,vx:n>2?(ox*0.02):0, dmg:player.atk});
      }
      SFX.shoot();
    }
  }
  if(player.flash>0)player.flash--;
}

function updateBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx; b.y+=b.vy;
    if(b.y<-20||b.x<-20||b.x>W+20){bullets.splice(i,1);continue;}
    // 命中判定
    for(const e of enemies){
      if(e.dead||e.hp<=0)continue;
      if(Math.abs(b.x-e.x)<e.r*0.85 && Math.abs(b.y-e.y)<e.r*0.85){
        e.hp-=b.dmg;
        let crit=Math.random()<player.crit;
        if(crit)e.hp-=b.dmg;
        addFloat(e.x+rnd(-10,10),e.y-e.r*0.6,(crit?"暴击 ":"")+b.dmg+(crit?"!":""),crit?"#ffd94a":"#eef6ff",crit?18:13);
        boom(b.x,b.y,null,3);
        SFX.hit();
        bullets.splice(i,1);
        break;
      }
    }
  }
}

function updateEnemies(){
  for(const q of spawnQueue){ if(q.delay-->0)continue;
    enemies.push({type:q.type,x:q.x,y:q.y,hp:q.hp,maxHp:q.maxHp,
      r:q.type==="boss"?19*PX:(q.type==="mush"?13*PX*0.55:9*PX*0.5),
      wob:rnd(0,Math.PI*2), vy:q.type==="boss"?0.42:rnd(0.55,0.85)+level*0.03});
  }
  spawnQueue=spawnQueue.filter(q=>q.delay>0);

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.y+=e.vy;
    e.wob+=0.08;
    if(e.type!=="boss") e.x+=Math.sin(e.wob)*0.5;
    // 撞到玩家
    if(Math.abs(e.x-player.x)<(e.r+player.w/2)*0.8 &&
       Math.abs(e.y-player.y)<(e.r+player.h/2)*0.8){
      e.dead=true; enemies.splice(i,1);
      hurtPlayer();
      boom(e.x,e.y,"#e8404a",18);
      continue;
    }
    if(e.hp<=0){
      boom(e.x,e.y,e.type==="boss"?"#c86aff":"#ff9d2e",e.type==="boss"?60:16,e.type==="boss");
      if(e.type==="boss"){SFX.bigboom();}else SFX.boom();
      score+=e.type==="boss"?500:50;
      addFloat(e.x,e.y,"+"+(e.type==="boss"?500:50),"#7dff6a",16);
      enemies.splice(i,1);
    }
  }
}

function hurtPlayer(){
  player.hp--; player.flash=20; SFX.hurt(); shake=14;
  addFloat(player.x,player.y-30,"-1","#e8404a",20);
  if(player.hp<=0){
    state="over";
    best=Math.max(best,level);
    localStorage.setItem("sdzj_best",best);
    SFX.bigboom();
    boom(player.x,player.y,null,60,true);
  }
}

function checkWaveEnd(){
  if(state!=="play")return;
  if(spawnQueue.length===0&&enemies.length===0&&!gatePending){
    gatePending=true;
    setTimeout(()=>{ if(state==="play"){ makeGates(); gatePending=false; } },500);
  }
}

function chooseGate(g){
  g.alive=false;
  g.def.apply();
  boom(g.x,g.y,g.def.good?"#7dff6a":"#e8404a",26,true);
  if(g.def.good){SFX.gate();addFloat(g.x,g.y-70,g.def.label,"#7dff6a",24);}
  else{SFX.bad();addFloat(g.x,g.y-70,g.def.label,"#e8404a",24);}
  const other=gates.find(o=>o!==g&&o.alive);
  if(other){other.alive=false;boom(other.x,other.y,"#5c6f85",10);}
  waveInLevel++;
  if(waveInLevel>4){
    waveInLevel=0;level++;totalWave++;
    addFloat(W/2,H*0.35,"第 "+level+" 关","#4aa8ff",26);
    SFX.win();
  }
  setTimeout(()=>{ if(state==="gate"){state="play";spawnWave();} },650);
}

function updateGates(){
  if(state!=="gate")return;
  gateTimer++;
  for(const g of gates){
    if(!g.alive)continue;
    // 与怪物同速，向战机方向下压
    g.y += g.vy;
    g.bob = (g.bob||0) + 0.08;
    // 用战机机体撞门 = 打击选择（陷阱门撞上也中招）
    if(Math.abs(player.x-g.x)<g.w/2 && Math.abs(player.y-g.y)<g.h/2+player.h*0.3){
      chooseGate(g); break;
    }
  }
  // 两扇门全部下压出屏仍没选 → 自动撞最近的一扇（含陷阱），避免卡死
  const alive=gates.filter(g=>g.alive);
  if(alive.length>0 && alive.every(g=>g.y>H+140)){
    alive.sort((a,b)=>Math.abs(a.x-player.x)-Math.abs(b.x-player.x));
    chooseGate(alive[0]);
  }
}

function updateFx(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life--;
    if(p.life<=0)parts.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.y-=0.7;f.life--;
    if(f.life<=0)floats.splice(i,1);
  }
  for(let i=flames.length-1;i>=0;i--){
    const f=flames[i];f.y+=f.vy;f.life--;
    if(f.life<=0)flames.splice(i,1);
  }
  if(shake>0)shake*=0.85;
}

function update(){
  frame++;
  if(state==="play"||state==="gate"){
    updatePlayer();
    updateBullets();
    if(state==="play")updateEnemies();
    updateGates();
    checkWaveEnd();
  }
  updateFx();
}

/* ============================================================
   渲染
   ============================================================ */
function bg(){
  // 竖直深空渐变 + 滚动星点
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0d1330");g.addColorStop(0.55,"#101b3f");g.addColorStop(1,"#1a1038");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!bg.stars){
    bg.stars=[];
    for(let i=0;i<60;i++)bg.stars.push({x:rnd(0,W),y:rnd(0,H),s:rnd(0.4,1.8),v:rnd(0.3,1.4)});
  }
  for(const s of bg.stars){
    s.y+=s.v; if(s.y>H){s.y=-2;s.x=rnd(0,W);}
    ctx.fillStyle=s.s>1.2?"#9df3ff":"#3a4a7a";
    ctx.fillRect(s.x,s.y,s.s,s.s*2);
  }
  // 远景像素云
  ctx.globalAlpha=0.15;
  for(let i=0;i<3;i++){
    const cy=((frame*0.2+i*300)%(H+200))-100;
    ctx.fillStyle=i%2?"#4aa8ff":"#c86aff";
    ctx.fillRect(40+i*140,cy,120,18);
    ctx.fillRect(60+i*140,cy-12,80,12);
  }
  ctx.globalAlpha=1;
}
function drawImgCenter(img,x,y){
  ctx.drawImage(img,Math.round(x-img.width/2),Math.round(y-img.height/2));
}
function drawHpBar(x,y,w,ratio,color){
  ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(x-w/2,y,w,6);
  ctx.fillStyle=color||"#e8404a";ctx.fillRect(x-w/2+1,y+1,(w-2)*clamp(ratio,0,1),4);
}
function render(){
  ctx.save();
  if(shake>0.5)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  bg();
  // 引擎火焰
  for(const f of flames){ctx.globalAlpha=f.life/16;ctx.fillStyle=f.color;
    ctx.fillRect(f.x-1,f.y,3,5);}
  ctx.globalAlpha=1;
  // 门
  for(const g of gates){
    if(!g.alive)continue;
    const good=g.def.good;
    ctx.fillStyle=good?"rgba(40,200,90,0.28)":"rgba(210,60,60,0.28)";
    ctx.strokeStyle=good?"#7dff6a":"#e8404a";
    ctx.lineWidth=3;
    const pulse=2+Math.sin(frame*0.15)*1.5;
    ctx.fillRect(g.x-g.w/2,g.y-g.h/2,g.w,g.h);
    ctx.strokeRect(g.x-g.w/2-pulse/2,g.y-g.h/2-pulse/2,g.w+pulse,g.h+pulse);
    // 门顶横幅
    ctx.fillStyle=good?"#7dff6a":"#e8404a";
    ctx.fillRect(g.x-g.w/2,g.y-g.h/2-30,g.w,26);
    ctx.fillStyle="#0a0e1a";
    ctx.font="bold 17px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(g.def.label,g.x,g.y-g.h/2-16);
    // 内部纹理（竖条光）
    ctx.globalAlpha=0.25;
    for(let i=0;i<5;i++){
      ctx.fillStyle=good?"#7dff6a":"#e8404a";
      ctx.fillRect(g.x-g.w/2+10+i*(g.w-20)/5,g.y-g.h/2+8,(g.w-20)/5-8,g.h-16);
    }
    ctx.globalAlpha=1;
  }
  // 选门提示（门正从上方下压，撞向一扇即生效）
  if(state==="gate"&&gates.some(g=>g.alive)){
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle="#eef6ff";ctx.font="bold 20px 'Microsoft YaHei'";
    ctx.fillText("门正在逼近 — 撞向一扇获得效果！",W/2,H*0.13);
    ctx.fillStyle="#ff9d2e";ctx.font="bold 13px 'Microsoft YaHei'";
    ctx.fillText("（绿色=增益，红色=陷阱，撞哪个生效哪个）",W/2,H*0.13+24);
  }
  // 敌人
  for(const e of enemies){
    const img=e.type==="boss"?IMG.boss:(e.type==="mush"?IMG.mush:IMG.zomb);
    const bob=Math.sin(e.wob*2)*(e.type==="boss"?0:2);
    drawImgCenter(img,e.x,e.y+bob);
    if(e.type==="boss"){
      drawHpBar(e.x,e.y-e.r-26,180,e.hp/e.maxHp,"#c86aff");
      ctx.fillStyle="#eef6ff";ctx.font="bold 16px monospace";ctx.textAlign="center";
      ctx.fillText(e.hp,e.x,e.y-e.r-34);
      ctx.fillStyle="#c86aff";ctx.font="bold 14px 'Microsoft YaHei'";
      ctx.fillText("BOSS",e.x,e.y-e.r-52);
    }else{
      drawHpBar(e.x,e.y-e.r-14,e.type==="mush"?52:40,e.hp/e.maxHp,"#e8404a");
      ctx.fillStyle="#eef6ff";ctx.font="bold 12px monospace";ctx.textAlign="center";
      ctx.fillText(e.hp,e.x,e.y-e.r-20);
    }
  }
  // 子弹（能量弹）
  for(const b of bullets){
    ctx.fillStyle="#4aa8ff";ctx.fillRect(b.x-3,b.y-10,6,16);
    ctx.fillStyle="#9df3ff";ctx.fillRect(b.x-1,b.y-10,2,16);
    ctx.fillStyle="#ffd94a";ctx.fillRect(b.x-2,b.y-12,4,3);
  }
  // 玩家
  if(state!=="over"){
    const img=player.tilt<-0.15?IMG.shipL:(player.tilt>0.15?IMG.shipR:IMG.ship);
    if(player.flash>0&&frame%4<2)ctx.globalAlpha=0.35;
    drawImgCenter(img,player.x,player.y);
    ctx.globalAlpha=1;
    // 护盾光环（受击短暂显示）
    if(player.flash>0){
      ctx.strokeStyle="rgba(232,64,74,0.6)";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(player.x,player.y,player.h*0.75,0,Math.PI*2);ctx.stroke();
    }
  }
  // 粒子
  for(const p of parts){
    ctx.globalAlpha=Math.min(1,p.life/15);
    ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;
  // 飘字
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.life/18);
    ctx.fillStyle=f.color;
    ctx.font="bold "+f.size+"px 'Microsoft YaHei',monospace";
    ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
  drawHud();
  if(state==="menu")drawMenu();
  if(state==="over")drawOver();
  ctx.restore();
}

function drawHud(){
  // 顶栏
  ctx.fillStyle="rgba(6,10,26,0.65)";ctx.fillRect(0,0,W,64);
  ctx.strokeStyle="#1b3a6e";ctx.lineWidth=2;ctx.strokeRect(0,0,W,64);
  ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillStyle="#4aa8ff";ctx.font="bold 20px 'Microsoft YaHei'";
  ctx.fillText("第 "+level+" 关",16,22);
  ctx.fillStyle="#eef6ff";ctx.font="13px 'Microsoft YaHei'";
  const waveName=waveInLevel===4?"BOSS战":"第 "+(waveInLevel+1)+"/5 波";
  ctx.fillText(waveName,16,46);
  // 分数
  ctx.textAlign="center";
  ctx.fillStyle="#ffd94a";ctx.font="bold 16px monospace";
  ctx.fillText("SCORE "+score,W/2,24);
  ctx.fillStyle="#8fa3b8";ctx.font="11px 'Microsoft YaHei'";
  ctx.fillText("最高纪录：第 "+best+" 关",W/2,45);
  // 血量（战机图标）
  ctx.textAlign="right";
  for(let i=0;i<player.maxHp;i++){
    const hx=W-24-i*28, hy=32;
    ctx.fillStyle=i<player.hp?"#e8404a":"#2a2f40";
    ctx.fillRect(hx-9,hy-9,18,18);
    ctx.fillStyle=i<player.hp?"#ff9d9f":"#1a1e2c";
    ctx.fillRect(hx-9,hy-9,18,5);
    ctx.fillRect(hx-9,hy+4,18,5);
  }
  // 底部属性栏
  ctx.fillStyle="rgba(6,10,26,0.65)";ctx.fillRect(0,H-34,W,34);
  ctx.strokeStyle="#1b3a6e";ctx.strokeRect(0,H-34,W,34);
  ctx.textAlign="left";ctx.fillStyle="#eef6ff";ctx.font="13px 'Microsoft YaHei'";
  ctx.fillText("攻击 "+player.atk,14,H-17);
  ctx.fillStyle="#9df3ff";ctx.fillText("攻速 "+(26/player.fireGap).toFixed(1)+"x",120,H-17);
  ctx.fillStyle="#7dff6a";ctx.fillText("弹道 "+player.bullets,225,H-17);
  ctx.fillStyle="#ffd94a";ctx.fillText("暴击 "+Math.round(player.crit*100)+"%",320,H-17);
}

function drawMenu(){
  ctx.fillStyle="rgba(6,10,26,0.72)";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle="#4aa8ff";
  ctx.font="bold 52px 'Microsoft YaHei'";
  ctx.fillText("时 代 战 机",W/2,H*0.3);
  ctx.fillStyle="#9df3ff";ctx.font="16px 'Microsoft YaHei'";
  ctx.fillText("穿越增益门 · 强化火力 · 击碎怪群",W/2,H*0.3+44);
  // 战机展示
  const bob=Math.sin(frame*0.06)*6;
  drawImgCenter(IMG.ship,W/2,H*0.47+bob);
  ctx.fillStyle="#eef6ff";ctx.font="15px 'Microsoft YaHei'";
  ctx.fillText("鼠标 / 手指左右拖动，战机自动开火",W/2,H*0.62);
  ctx.fillText("穿过绿门获得增益，小心陷阱门！",W/2,H*0.62+26);
  const blink=frame%60<40;
  if(blink){
    ctx.fillStyle="#ffd94a";ctx.font="bold 24px 'Microsoft YaHei'";
    ctx.fillText("点 净 空 屏 幕 开 始",W/2,H*0.75);
  }
  ctx.fillStyle="#8fa3b8";ctx.font="12px 'Microsoft YaHei'";
  ctx.fillText("最高纪录：第 "+best+" 关",W/2,H*0.75+40);
}

function drawOver(){
  ctx.fillStyle="rgba(6,10,26,0.72)";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle="#e8404a";ctx.font="bold 44px 'Microsoft YaHei'";
  ctx.fillText("战 机 被 击 落",W/2,H*0.36);
  ctx.fillStyle="#eef6ff";ctx.font="20px 'Microsoft YaHei'";
  ctx.fillText("坚持到了 第 "+level+" 关",W/2,H*0.36+52);
  ctx.fillStyle="#ffd94a";ctx.font="bold 18px monospace";
  ctx.fillText("SCORE  "+score,W/2,H*0.36+86);
  if(score>0&&level>=best&&level>1){
    ctx.fillStyle="#7dff6a";ctx.font="bold 16px 'Microsoft YaHei'";
    ctx.fillText("★ 新纪录！ ★",W/2,H*0.36+116);
  }
  if(frame%60<40){
    ctx.fillStyle="#4aa8ff";ctx.font="bold 22px 'Microsoft YaHei'";
    ctx.fillText("点 击 重 新 出 击",W/2,H*0.62);
  }
}

/* ---------- 主循环 ---------- */
function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
