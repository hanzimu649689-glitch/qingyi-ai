<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>赵云与阿斗 · 长坂坡七进七出</title>
<style>
  html,body{margin:0;height:100%;background:#080a10;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#10131c;
    box-shadow:0 0 0 2px #2a3040,0 12px 40px rgba(0,0,0,.75);
    height:100vh;max-width:100vw;aspect-ratio:480/720;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<script>
(() => {
'use strict';
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = cvs.width, H = cvs.height;
ctx.imageSmoothingEnabled = false;

/* ============ 工具 ============ */
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
function hash(n){ n = (n<<13)^n; return ((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/0x7fffffff; }

/* ============ 像素图 ============ */
function makeSprite(rows, pal){
  const h=rows.length, w=rows[0].length;
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const g=cv.getContext('2d');
  for(let y=0;y<h;y++){
    const row=rows[y];
    for(let x=0;x<row.length;x++){
      const c=pal[row[x]]; if(!c) continue;
      g.fillStyle=c; g.fillRect(x,y,1,1);
    }
  }
  return cv;
}
function silhouette(pal, col){ const o={}; for(const k in pal) o[k]=col; return o; }

const PAL_ZHAO = {k:'#1b2233',b:'#3f6ea8',B:'#2b4a78',w:'#f0f3f8',W:'#c3cddf',
                  f:'#f6c9a0',h:'#2b2b33',r:'#d6453c'};
const ROWS_ZHAO = [
  '.....kkkkkk.....',
  '....kbbbbbbk....',
  '...kbbbbbbbbk...',
  '...kbffffffbk...',
  '...kfhffffhfk...',
  '...kbffffffbk...',
  '....kffffffk....',
  '..kbbbwwwwbbbk..',
  '.kbbbwwrrwwbbbk.',
  '.kbbwwwffwwwbbk.',
  '.kbbwwffffwwbbk.',
  '.kBBwwrrrrwwBBk.',
  '..kBBwwwwwwBBk..',
  '..kwwwwwwwwwwk..',
  '...kWWk..kWWk...',
  '...kWWk..kWWk...'
];
const ROWS_FOE = [
  '....kkkk....',
  '...khhhhk...',
  '..khffffhk..',
  '..kfhffhfk..',
  '..kffffffk..',
  '...kffffk...',
  '..kggGGggk..',
  '.kgggGGgggk.',
  '.kggggggggk.',
  '..kggggggk..',
  '..kGGkkGGk..',
  '...kk..kk...'
];
const PAL_GRUNT  = {k:'#1b2233',h:'#2b2b33',f:'#e0b48c',g:'#7e8593',G:'#565d6c'};
const PAL_AXE    = {k:'#1b2233',h:'#2b2b33',f:'#e0b48c',g:'#b4503f',G:'#7e3528'};
const PAL_ARCHER = {k:'#1b2233',h:'#2b2b33',f:'#e0b48c',g:'#5f8f5a',G:'#3d6540'};
const PAL_RIDER  = {k:'#1b2233',h:'#2b2b33',f:'#e0b48c',g:'#6a4f9c',G:'#432f6b'};
const PAL_BOSS   = {k:'#1b2233',h:'#2b2b33',f:'#e0b48c',g:'#c9a227',G:'#8a6d1a'};
const ROWS_BABY = [
  '..kkkk..',
  '.kffffk.',
  'kfhffhfk',
  'kffffffk',
  '.kffffk.',
  'krrrrrrk',
  'krrrrrrk',
  '.kk..kk.'
];
const PAL_BABY = {k:'#1b2233',f:'#f9d3ae',h:'#2b2b33',r:'#e05a4a'};

const SP = {
  zhao: makeSprite(ROWS_ZHAO, PAL_ZHAO),
  grunt: makeSprite(ROWS_FOE, PAL_GRUNT),
  axe: makeSprite(ROWS_FOE, PAL_AXE),
  archer: makeSprite(ROWS_FOE, PAL_ARCHER),
  rider: makeSprite(ROWS_FOE, PAL_RIDER),
  boss: makeSprite(ROWS_FOE, PAL_BOSS),
  foeSil: makeSprite(ROWS_FOE, silhouette(PAL_GRUNT,'#0d1017')),
  baby: makeSprite(ROWS_BABY, PAL_BABY),
  zhaoW: makeSprite(ROWS_ZHAO, silhouette(PAL_ZHAO,'#ffffff')),
  zhaoR: makeSprite(ROWS_ZHAO, silhouette(PAL_ZHAO,'#ff5a4a')),
  bossW: makeSprite(ROWS_FOE, silhouette(PAL_BOSS,'#ffffff'))
};
const FOE_W = {
  grunt: makeSprite(ROWS_FOE, silhouette(PAL_GRUNT,'#ffffff')),
  axe: makeSprite(ROWS_FOE, silhouette(PAL_AXE,'#ffffff')),
  archer: makeSprite(ROWS_FOE, silhouette(PAL_ARCHER,'#ffffff')),
  rider: makeSprite(ROWS_FOE, silhouette(PAL_RIDER,'#ffffff'))
};

function drawSprite(sp,x,y,scale,flip,alpha){
  ctx.save();
  if(alpha!==undefined) ctx.globalAlpha=alpha;
  ctx.translate(Math.round(x),Math.round(y));
  if(flip) ctx.scale(-1,1);
  ctx.drawImage(sp, -sp.width*scale/2, -sp.height*scale/2, sp.width*scale, sp.height*scale);
  ctx.restore();
}

/* ============ 草地贴图 ============ */
const TILE = (()=>{
  const s=128, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const g=cv.getContext('2d');
  g.fillStyle='#3b5f36'; g.fillRect(0,0,s,s);
  for(let i=0;i<420;i++){
    const x=(hash(i*3+1)*s)|0, y=(hash(i*7+2)*s)|0;
    g.fillStyle = hash(i*11+3)>0.5 ? '#456c3e' : '#335230';
    g.fillRect(x,y,2,1);
  }
  for(let i=0;i<26;i++){
    const x=(hash(i*13+5)*s)|0, y=(hash(i*17+6)*s)|0;
    g.fillStyle='#6b7a52'; g.fillRect(x,y,2,2);
  }
  g.strokeStyle='rgba(0,0,0,.16)'; g.lineWidth=1;
  for(let i=0;i<8;i++){
    const y=(hash(i*23+9)*s)|0;
    g.beginPath(); g.moveTo(0,y); g.lineTo(s,y); g.stroke();
  }
  return cv;
})();

/* ============ 音效 ============ */
let AC=null;
function sfx(type){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const P={hit:[180,60,.09,'square'],dash:[520,180,.12,'sawtooth'],
      kill:[300,90,.12,'triangle'],hurt:[220,70,.18,'square'],
      ult:[140,700,.5,'sawtooth'],pick:[700,1100,.12,'sine'],
      start:[400,900,.18,'square']}[type]||[300,200,.1,'square'];
    o.type=P[3]; o.frequency.setValueAtTime(P[0],t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,P[1]),t+P[2]);
    g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.0008,t+P[2]);
    o.start(t); o.stop(t+P[2]+.02);
  }catch(e){}
}

/* ============ 世界 ============ */
const WORLD_W = 560;         // 世界宽度（横向走位空间）
const PX_PER_LI = 6;         // 1 里 = 6 像素
const GOAL_LI = 800;         // 突围目标
const START_Y = 0;
const AUTO_SPEED = 165;      // 自动向前推进速度 px/s

let state='menu';            // menu | play | dead | win
let p, enemies, arrows, drops, parts, texts, decos;
let camX=0, camY=0, shake=0, time=0, kills=0, distance=0, best=0;
let spawnT=0, boss=null, bossPhase=0, combo=0, comboT=0, maxCombo=0;
let flash=0, msg=null, msgT=0;

try{ best = parseInt(localStorage.getItem('zy_ad_best')||'0',10)||0; }catch(e){}

function reset(){
  p = { x:WORLD_W/2, y:START_Y, hp:100, maxhp:100, r:13,
        aim:-Math.PI/2, face:1, dashT:0, dashCd:0, inv:0,
        autoCd:0, ult:0, ultT:0, ultHits:0, atkT:0, dmgT:0, sword:0 };
  enemies=[]; arrows=[]; drops=[]; parts=[]; texts=[]; decos=[];
  kills=0; distance=0; spawnT=0; boss=null; bossPhase=0;
  combo=0; comboT=0; maxCombo=0; time=0; flash=0; shake=0;
  camX = clamp(p.x - W/2, 0, WORLD_W-W);
  camY = p.y - H*0.68;
}

/* ============ 输入 ============ */
const keys={};
let mouse={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '||e.key==='Enter'){
    if(state==='menu'){ start(); }
    else if(state==='play'){ doDash(); }
    else if(state==='dead'||state==='win'){ state='menu'; }
    sfx('start');
  }
  if((e.key==='k'||e.key==='K') && state==='play') doUlt();
  if((e.key==='m'||e.key==='M')) muted=!muted;
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
cvs.addEventListener('pointermove',e=>{
  const r=cvs.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*(W/r.width);
  mouse.y=(e.clientY-r.top)*(H/r.height);
});
cvs.addEventListener('pointerdown',e=>{
  const r=cvs.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*(W/r.width);
  mouse.y=(e.clientY-r.top)*(H/r.height);
  if(state==='menu'){ start(); sfx('start'); }
  else if(state==='play'){ doDash(); }
  else { state='menu'; }
});
let muted=false;
function start(){ reset(); state='play'; sfx('start'); }

/* ============ 玩家动作 ============ */
function doDash(){
  if(p.dashCd>0 || p.ultT>0) return;
  p.dashT=0.18; p.dashCd=0.85; p.inv=Math.max(p.inv,0.28);
  p.autoCd=0.5;
  sfx('dash');
  for(let i=0;i<8;i++) burst(p.x,p.y,'#e8f0ff',2.2);
}
function doUlt(){
  if(p.ult<100 || p.ultT>0) return;
  p.ult=0; p.ultT=2.0; p.ultHits=0; p.inv=Math.max(p.inv,2.2);
  sfx('ult'); flash=0.5; shake=10;
  toast('七进七出！', '#ffe58a');
}
function hurt(n){
  if(p.inv>0) return;
  p.hp-=n; p.dmgT=0.25; p.inv=0.5; shake=6; flash=0.22;
  sfx('hurt');
  for(let i=0;i<6;i++) burst(p.x,p.y,'#ff6b5e',2.4);
  if(p.hp<=0){ p.hp=0; die(); }
}
function die(){
  state='dead';
  if(Math.floor(distance)>best){ best=Math.floor(distance); try{localStorage.setItem('zy_ad_best',String(best));}catch(e){} }
}
function win(){
  state='win'; flash=0.6;
  if(GOAL_LI>best){ best=GOAL_LI; try{localStorage.setItem('zy_ad_best',String(best));}catch(e){} }
}

/* ============ 特效 ============ */
function burst(x,y,col,sp){
  parts.push({x,y,vx:rnd(-sp*22,sp*22),vy:rnd(-sp*22,sp*22),
    life:rnd(.25,.55),max:.55,col,s:rnd(1.5,3.5)});
}
function floater(x,y,txt,col){ texts.push({x,y,txt,col,life:.8,vy:-40}); }
function toast(txt,col){ msg=txt; msgT=1.4; msgCol=col||'#ffe58a'; }
let msgCol='#ffe58a';

/* ============ 敌人 ============ */
const TYPES = {
  grunt:{sp:SP.grunt, hp:2,  spd:52, dmg:6,  r:9,  scale:1.6, li:1, score:1},
  axe:  {sp:SP.axe,   hp:4,  spd:44, dmg:9,  r:10, scale:1.8, li:2, score:2},
  archer:{sp:SP.archer,hp:2, spd:38, dmg:8,  r:9,  scale:1.6, li:2, score:2},
  rider:{sp:SP.rider, hp:5,  spd:96, dmg:10, r:11, scale:1.9, li:3, score:3}
};
function spawnEnemy(){
  const d=distance;
  let pool=['grunt','grunt','grunt'];
  if(d>60) pool.push('axe');
  if(d>140) pool.push('archer','axe');
  if(d>260) pool.push('rider','archer');
  if(d>420) pool.push('rider','axe','archer');
  const t=pool[rndi(0,pool.length-1)];
  const T=TYPES[t];
  // 70% 从上方来，30% 侧后方追击
  let ex,ey;
  if(Math.random()<0.7){
    ex = rnd(camX-40, camX+W+40);
    ey = camY - rnd(30,120);
  } else if(Math.random()<0.5){
    ex = camX - rnd(30,80); ey = rnd(camY-100, camY+H);
  } else {
    ex = camX + W + rnd(30,80); ey = rnd(camY-100, camY+H);
  }
  ex = clamp(ex, 10, WORLD_W-10);
  const hpScale = 1 + d/900;
  enemies.push({type:t,x:ex,y:ey,hp:T.hp*hpScale,maxhp:T.hp*hpScale,
    r:T.r,spd:T.spd*rnd(.9,1.12),dmg:T.dmg,T,atkCd:rnd(0,.6),hit:0,
    shotCd:rnd(.8,2.2),dashCd:rnd(1.5,3.5),dashing:0,face:1,wob:rnd(0,6.28)});
}
function spawnBoss(name,hp,spd,dmg){
  boss={name,x:p.x+rnd(-60,60),y:camY-120,hp,maxhp:hp,spd,dmg,r:16,
    atkCd:1,dashCd:2.4,dashing:0,hit:0,face:1,dead:0};
  toast(name+' 拦路！','#ff9d5c');
  flash=0.35; shake=8;
}
function damageEnemy(e,n,knock){
  e.hp-=n; e.hit=0.12;
  sfx('hit');
  for(let i=0;i<4;i++) burst(e.x,e.y,'#ff8a6a',1.6);
  if(knock){ const a=Math.atan2(e.y-p.y,e.x-p.x);
    e.x+=Math.cos(a)*knock; e.y+=Math.sin(a)*knock; }
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  const i=enemies.indexOf(e); if(i>=0) enemies.splice(i,1);
  kills++; combo++; comboT=2.5; maxCombo=Math.max(maxCombo,combo);
  distance += (e.T? e.T.li:2);
  p.ult = Math.min(100, p.ult + (e.type==='rider'?12:8));
  sfx('kill');
  for(let i=0;i<12;i++) burst(e.x,e.y,'#ff5a4a',2.6);
  floater(e.x,e.y-10, '+'+((e.T?e.T.li:2))+'里', '#9fe8a0');
  if(Math.random()<0.16) drops.push({x:e.x,y:e.y,t:'fu',life:9,vy:rnd(-18,18),vx:rnd(-18,18)});
  if(e.type==='rider' && Math.random()<0.3) drops.push({x:e.x,y:e.y,t:'jiu',life:9,vy:0,vx:0});
}

/* ============ 更新 ============ */
function update(dt){
  time+=dt;
  if(state!=='play'){ updateParts(dt); return; }

  // ---- 瞄准 ----
  const mwx = mouse.x+camX, mwy = mouse.y+camY;
  const aimA = Math.atan2(mwy-p.y, mwx-p.x);
  const kbA = (()=>{ let dx=0,dy=0;
    if(keys['a']||keys['arrowleft']) dx-=1;
    if(keys['d']||keys['arrowright']) dx+=1;
    if(keys['w']||keys['arrowup']) dy-=1;
    if(keys['s']||keys['arrowdown']) dy+=1;
    if(!dx&&!dy) return null; return Math.atan2(dy,dx); })();
  if(kbA!==null) p.aim = kbA; else p.aim = aimA;
  if(Math.cos(p.aim)>=0) p.face=1; else p.face=-1;

  // ---- 移动 ----
  let mx=0,my=0;
  if(keys['a']||keys['arrowleft']) mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  if(keys['w']||keys['arrowup']) my-=1;
  if(keys['s']||keys['arrowdown']) my+=1;
  const len=Math.hypot(mx,my)||1;
  const SPD = 132;
  let vx = mx/len*SPD, vy = my/len*SPD;
  // 自动向北推进
  const pushing = boss? 0.35 : 1;
  vy -= AUTO_SPEED*pushing;

  if(p.dashT>0){
    p.dashT-=dt;
    const ds = 620;
    vx = Math.cos(p.aim)*ds; vy = Math.sin(p.aim)*ds - AUTO_SPEED*0.4*pushing;
  }
  if(p.ultT>0){ // 七进七出：自动冲向敌群
    p.ultT-=dt;
    let tx=p.x,ty=p.y-100, bd=1e9;
    for(const e of enemies){ const d=dist2(e.x,e.y,p.x,p.y); if(d<bd){bd=d;tx=e.x;ty=e.y;} }
    if(boss && bd>1e8){ tx=boss.x; ty=boss.y; }
    const a=Math.atan2(ty-p.y,tx-p.x);
    vx=Math.cos(a)*440; vy=Math.sin(a)*440;
    p.aim=a;
    p.ultHits-=dt;
    if(p.ultHits<=0){
      p.ultHits=0.16; shake=5;
      for(const e of enemies.slice()) if(dist2(e.x,e.y,p.x,p.y)<95*95) damageEnemy(e,8,26);
      if(boss && dist2(boss.x,boss.y,p.x,p.y)<115*115){
        boss.hp-=8; boss.hit=0.12; sfx('hit');
        for(let i=0;i<5;i++) burst(boss.x,boss.y,'#ffd76a',2);
        if(boss.hp<=0) bossDead();
      }
      for(let i=0;i<10;i++) burst(p.x,p.y,'#fff0c0',3);
    }
  }
  p.x = clamp(p.x+vx*dt, 14, WORLD_W-14);
  p.y += vy*dt;

  // ---- 推进距离 ----
  const li = (START_Y - p.y)/PX_PER_LI;
  if(li>distance){ distance=li; }
  if(distance>=GOAL_LI){ win(); return; }

  // ---- 计时器 ----
  p.dashCd=Math.max(0,p.dashCd-dt);
  p.inv=Math.max(0,p.inv-dt);
  p.autoCd=Math.max(0,p.autoCd-dt);
  p.dmgT=Math.max(0,p.dmgT-dt);
  p.sword=Math.max(0,p.sword-dt);
  if(comboT>0){ comboT-=dt; if(comboT<=0) combo=0; }
  if(msgT>0) msgT-=dt;

  // ---- 自动普攻 ----
  if(p.autoCd<=0){
    let tgt=null,bd=60*60;
    for(const e of enemies){ const d=dist2(e.x,e.y,p.x,p.y); if(d<bd){bd=d;tgt=e;} }
    if(!tgt && boss && dist2(boss.x,boss.y,p.x,p.y)<70*70) tgt=boss;
    if(tgt){
      p.autoCd=0.42; p.atkT=0.16;
      const a=Math.atan2(tgt.y-p.y,tgt.x-p.x);
      const dmg = (p.sword>0? 2.4 : 1.4);
      sfx('hit');
      for(const e of enemies.slice()){
        const dd=Math.hypot(e.x-p.x,e.y-p.y);
        if(dd<58 && Math.abs(angDiff(Math.atan2(e.y-p.y,e.x-p.x),a))<1.0) damageEnemy(e,dmg,12);
      }
      if(boss && Math.hypot(boss.x-p.x,boss.y-p.y)<66){
        boss.hp-=dmg; boss.hit=0.12;
        for(let i=0;i<3;i++) burst(boss.x,boss.y,'#ffd76a',1.4);
        if(boss.hp<=0) bossDead();
      }
      for(let i=0;i<5;i++){
        const aa=a+rnd(-.5,.5);
        parts.push({x:p.x+Math.cos(aa)*30,y:p.y+Math.sin(aa)*30,
          vx:Math.cos(aa)*60,vy:Math.sin(aa)*60,life:.18,max:.18,col:'#cfe4ff',s:2});
      }
    }
  }
  p.atkT=Math.max(0,p.atkT-dt);

  // ---- 生成敌人 ----
  const cap = boss? 12 : Math.min(46, 20 + distance/28);
  spawnT-=dt;
  if(spawnT<=0 && enemies.length<cap){
    spawnT = Math.max(0.24, 0.85 - distance/1400);
    spawnEnemy();
    if(distance>300 && Math.random()<0.35) spawnEnemy();
  }
  if(!boss){
    if(bossPhase===0 && distance>=220){ bossPhase=1; spawnBoss('夏侯恩（青釭剑）',70,72,14); }
    else if(bossPhase===1 && distance>=520){ bossPhase=2; spawnBoss('张郃',110,84,16); }
    else if(bossPhase===2 && distance>=700 && kills>60){ bossPhase=3; spawnBoss('曹操亲卫·虎豹骑',140,96,18); }
  }

  // ---- 敌人 AI ----
  for(const e of enemies){
    e.hit=Math.max(0,e.hit-dt);
    e.atkCd=Math.max(0,e.atkCd-dt);
    e.wob+=dt*8;
    const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
    if(dx>=0) e.face=1; else e.face=-1;
    if(e.type==='archer'){
      if(d>200){ e.x+=dx/d*e.spd*dt; e.y+=dy/d*e.spd*dt; }
      else if(d<130){ e.x-=dx/d*e.spd*dt; e.y-=dy/d*e.spd*dt; }
      e.shotCd-=dt;
      if(e.shotCd<=0 && d<320){
        e.shotCd=rnd(1.6,2.4);
        arrows.push({x:e.x,y:e.y,vx:dx/d*230,vy:dy/d*230,life:2.4,r:4});
      }
    } else if(e.type==='rider'){
      e.dashCd-=dt;
      if(e.dashing>0){ e.dashing-=dt; e.x+=dx/d*260*dt; e.y+=dy/d*260*dt; }
      else if(e.dashCd<=0 && d<220){ e.dashing=0.45; e.dashCd=rnd(2.2,3.6); }
      else { e.x+=dx/d*e.spd*dt; e.y+=dy/d*e.spd*dt; }
    } else {
      e.x += dx/d*e.spd*dt; e.y += dy/d*e.spd*dt;
    }
    // 接触伤害（打在赵云身上 = 惊到阿斗）
    if(d < e.r+p.r+2 && e.atkCd<=0){
      e.atkCd=0.75;
      hurt(e.dmg);
      floater(p.x, p.y-24, '-'+Math.round(e.dmg), '#ff8f80');
    }
    // 离开视野太远则回收
    if(e.y > p.y+520 || e.y < p.y-900 || e.x<-160 || e.x>WORLD_W+160){
      const i=enemies.indexOf(e); if(i>=0) enemies.splice(i,1);
    }
  }

  // ---- Boss ----
  if(boss){
    boss.hit=Math.max(0,boss.hit-dt);
    boss.atkCd=Math.max(0,boss.atkCd-dt);
    boss.dashCd-=dt;
    const dx=p.x-boss.x, dy=p.y-boss.y, d=Math.hypot(dx,dy)||1;
    if(dx>=0) boss.face=1; else boss.face=-1;
    if(boss.dashing>0){
      boss.dashing-=dt;
      boss.x+=Math.cos(boss.da)*330*dt; boss.y+=Math.sin(boss.da)*330*dt;
    } else if(boss.dashCd<=0 && d<300){
      boss.dashing=0.6; boss.dashCd=rnd(1.8,2.8); boss.da=Math.atan2(dy,dx);
      toast(boss.name.split('（')[0]+' 突袭！','#ffb36a');
    } else {
      boss.x+=dx/d*boss.spd*dt; boss.y+=dy/d*boss.spd*dt;
    }
    if(d<boss.r+p.r+4 && boss.atkCd<=0){
      boss.atkCd=1.0; hurt(boss.dmg);
      floater(p.x,p.y-24,'-'+boss.dmg,'#ff8f80');
    }
  }

  // ---- 箭 ----
  for(let i=arrows.length-1;i>=0;i--){
    const a=arrows[i]; a.x+=a.vx*dt; a.y+=a.vy*dt; a.life-=dt;
    if(dist2(a.x,a.y,p.x,p.y) < (p.r+4)*(p.r+4)){
      hurt(8); floater(p.x,p.y-24,'-8','#ff8f80');
      arrows.splice(i,1); continue;
    }
    if(a.life<=0) arrows.splice(i,1);
  }

  // ---- 掉落 ----
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vx*=0.94; d.vy*=0.94; d.life-=dt;
    if(dist2(d.x,d.y,p.x,p.y) < 34*34){
      if(d.t==='fu'){ p.hp=Math.min(p.maxhp,p.hp+12); floater(p.x,p.y-30,'平安符 +12','#ffe58a'); }
      else { p.sword=10; floater(p.x,p.y-30,'青釭剑！攻击提升','#ff9d5c'); }
      sfx('pick');
      drops.splice(i,1); continue;
    }
    if(d.life<=0) drops.splice(i,1);
  }

  // ---- 摄像机 ----
  camX = clamp(camX + (clamp(p.x-W/2,0,WORLD_W-W) - camX)*Math.min(1,dt*6), 0, WORLD_W-W);
  camY = camY + ((p.y - H*0.68) - camY)*Math.min(1,dt*7);
  shake=Math.max(0,shake-dt*26);
  flash=Math.max(0,flash-dt*2.2);
  updateParts(dt);
}
function angDiff(a,b){ let d=a-b; while(d>Math.PI)d-=6.283; while(d<-Math.PI)d+=6.283; return d; }
function bossDead(){
  toast(boss.name.split('（')[0]+' 败退！','#9fe8a0');
  flash=0.5; shake=12;
  for(let i=0;i<30;i++) burst(boss.x,boss.y,'#ffd76a',3.4);
  distance += 30; kills += 10;
  drops.push({x:boss.x,y:boss.y,t:'jiu',life:12,vy:0,vx:0});
  boss=null;
  if(bossPhase<3) bossPhase=Math.max(bossPhase,1);
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i]; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=0.9; q.vy*=0.9;
    q.life-=dt; if(q.life<=0) parts.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){
    const t=texts[i]; t.y+=t.vy*dt; t.vy*=0.92; t.life-=dt;
    if(t.life<=0) texts.splice(i,1);
  }
}

/* ============ 绘制 ============ */
function drawGround(){
  const ox = -((camX%128)+128)%128, oy = -((camY%128)+128)%128;
  for(let y=oy-128; y<H+128; y+=128)
    for(let x=ox-128; x<W+128; x+=128)
      ctx.drawImage(TILE,x,y);
  // 世界边界暗角
  if(camX<12){ ctx.fillStyle='rgba(0,0,0,.32)'; ctx.fillRect(0,0,(12-camX)*1.5,H); }
}
function drawDecos(){
  const step=170;
  const i0=Math.floor((camY-200)/step), i1=Math.floor((camY+H+200)/step);
  for(let i=i0;i<=i1;i++){
    for(let k=0;k<3;k++){
      const hx=hash(i*31+k*7), hy=hash(i*17+k*13+2);
      const x=hx*(WORLD_W-60)+30, y=i*step+hy*step;
      const sx=x-camX, sy=y-camY;
      if(sx<-80||sx>W+80||sy<-120||sy>H+120) continue;
      const t=hash(i*53+k*3+9);
      if(t<0.4){ // 松树
        ctx.fillStyle='#2c3a24';
        ctx.beginPath(); ctx.moveTo(sx,sy-46); ctx.lineTo(sx-14,sy); ctx.lineTo(sx+14,sy); ctx.fill();
        ctx.fillStyle='#22301d';
        ctx.beginPath(); ctx.moveTo(sx,sy-32); ctx.lineTo(sx-10,sy+2); ctx.lineTo(sx+10,sy+2); ctx.fill();
        ctx.fillStyle='#4a3524'; ctx.fillRect(sx-2,sy,4,9);
      } else if(t<0.72){ // 曹营帐篷
        ctx.fillStyle='#4a3b2a';
        ctx.beginPath(); ctx.moveTo(sx,sy-34); ctx.lineTo(sx-24,sy); ctx.lineTo(sx+24,sy); ctx.fill();
        ctx.fillStyle='#5b4832'; ctx.fillRect(sx-24,sy-4,48,6);
        ctx.fillStyle='#8c2f2a'; ctx.fillRect(sx-1,sy-42,2,10);
        ctx.fillStyle='#c33b30';
        ctx.beginPath(); ctx.moveTo(sx+1,sy-42); ctx.lineTo(sx+16,sy-37); ctx.lineTo(sx+1,sy-32); ctx.fill();
      } else { // 石块 / 尸痕
        ctx.fillStyle='#55603f'; ctx.fillRect(sx-10,sy-5,20,7);
        ctx.fillStyle='#3f4a30'; ctx.fillRect(sx-8,sy-8,14,4);
      }
    }
  }
}
function drawSpear(px,py,scale){
  const a=p.aim;
  const push = (p.atkT>0? 12*(p.atkT/0.16) : 0) + (p.dashT>0? 10:0);
  ctx.save();
  ctx.translate(px,py); ctx.rotate(a);
  const L=44*scale, off=-6+push;
  // 杆
  ctx.fillStyle='#8a6b4a'; ctx.fillRect(off,-2*scale,L*0.7,4*scale);
  // 银枪头
  ctx.fillStyle='#dfe9f7';
  ctx.beginPath();
  ctx.moveTo(off+L*0.68,-3.4*scale); ctx.lineTo(off+L,-0.2*scale);
  ctx.lineTo(off+L*0.68,3.4*scale); ctx.closePath(); ctx.fill();
  // 红缨
  ctx.fillStyle='#d6453c'; ctx.fillRect(off+L*0.58,-4*scale,5*scale,8*scale);
  ctx.restore();
}
function drawPlayer(){
  const sx=p.x-camX, sy=p.y-camY;
  // 影子
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(sx,sy+15,14,5,0,0,6.283); ctx.fill();
  const sc=2.1;
  const bob = Math.sin(time*10)*(p.dashT>0?0:1)*1.2;
  let alpha=1;
  if(p.inv>0 && Math.floor(time*20)%2===0) alpha=0.55;
  if(p.ultT>0 && Math.floor(time*30)%2===0){
    ctx.save(); ctx.globalAlpha=.35;
    drawSprite(SP.zhao, sx - Math.cos(p.aim)*16, sy - Math.sin(p.aim)*16 + bob, sc, p.face<0);
    ctx.restore();
  }
  drawSprite(SP.zhao, sx, sy+bob, sc, p.face<0, alpha);
  if(p.dmgT>0){
    ctx.save(); ctx.globalAlpha=clamp(p.dmgT*3,0,0.95);
    drawSprite(SP.zhaoR, sx, sy+bob, sc, p.face<0);
    ctx.restore();
  }
  // 阿斗（绑在胸前）
  drawSprite(SP.baby, sx + p.face*2, sy+7+bob, 1.5, false, 1);
  // 枪
  drawSpear(sx, sy-2+bob, 1);
  // 无敌/突刺光
  if(p.inv>0.05){
    ctx.save(); ctx.globalAlpha=.28; ctx.strokeStyle=p.ultT>0?'#ffe58a':'#9fd8ff';
    ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx,sy,20+Math.sin(time*12)*2,0,6.283); ctx.stroke(); ctx.restore();
  }
}
function drawEnemies(){
  for(const e of enemies){
    const sx=e.x-camX, sy=e.y-camY;
    if(sx<-60||sx>W+60||sy<-80||sy>H+80) continue;
    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(sx,sy+9,9,3.5,0,0,6.283); ctx.fill();
    const wob = Math.sin(e.wob)*1.2;
    drawSprite(e.T.sp, sx, sy+wob, e.T.scale, e.face<0);
    if(e.hit>0){
      ctx.save(); ctx.globalAlpha=clamp(e.hit*6,0,0.9);
      drawSprite(FOE_W[e.type], sx, sy+wob, e.T.scale, e.face<0);
      ctx.restore();
    }
    // 血条
    if(e.hp<e.maxhp){
      const w=22;
      ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(sx-w/2,sy-16,w,3);
      ctx.fillStyle='#ff6b5e'; ctx.fillRect(sx-w/2,sy-16,w*(e.hp/e.maxhp),3);
    }
  }
}
function drawBoss(){
  if(!boss) return;
  const sx=boss.x-camX, sy=boss.y-camY;
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(sx,sy+20,22,7,0,0,6.283); ctx.fill();
  drawSprite(SP.boss, sx, sy, 3.0, boss.face<0);
  if(boss.hit>0){
    ctx.save(); ctx.globalAlpha=clamp(boss.hit*6,0,0.9);
    drawSprite(SP.bossW, sx, sy, 3.0, boss.face<0);
    ctx.restore();
  }
  // 名字 + 血条
  ctx.font='bold 13px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
  ctx.fillStyle='#ffd76a'; ctx.fillText(boss.name, sx, sy-34);
  const bw=90;
  ctx.fillStyle='rgba(0,0,0,.65)'; ctx.fillRect(sx-bw/2,sy-28,bw,7);
  ctx.fillStyle='#e04b3a'; ctx.fillRect(sx-bw/2,sy-28,bw*clamp(boss.hp/boss.maxhp,0,1),7);
  ctx.strokeStyle='#ffd76a'; ctx.lineWidth=1; ctx.strokeRect(sx-bw/2,sy-28,bw,7);
}
function drawDrops(){
  for(const d of drops){
    const sx=d.x-camX, sy=d.y-camY;
    if(sx<-30||sx>W+30||sy<-30||sy>H+30) continue;
    const fl = d.life<3 && Math.floor(d.life*8)%2===0;
    if(fl) continue;
    const bo=Math.sin(time*5+d.x)*2;
    if(d.t==='fu'){
      ctx.fillStyle='#f2d67a'; ctx.fillRect(sx-6,sy-9+bo,12,16);
      ctx.fillStyle='#c33b30'; ctx.fillRect(sx-3,sy-6+bo,6,10);
      ctx.strokeStyle='#8a6b1a'; ctx.lineWidth=1; ctx.strokeRect(sx-6,sy-9+bo,12,16);
    } else {
      ctx.fillStyle='#7fd4ff'; ctx.fillRect(sx-5,sy-8+bo,10,14);
      ctx.fillStyle='#2b6b8a'; ctx.fillRect(sx-3,sy-11+bo,6,4);
      ctx.strokeStyle='#e8f6ff'; ctx.lineWidth=1; ctx.strokeRect(sx-5,sy-8+bo,10,14);
    }
  }
}
function drawParts(){
  for(const q of parts){
    const a=clamp(q.life/q.max,0,1);
    ctx.globalAlpha=a;
    ctx.fillStyle=q.col;
    ctx.fillRect(q.x-camX-q.s/2, q.y-camY-q.s/2, q.s, q.s);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const t of texts){
    ctx.globalAlpha=clamp(t.life/0.8,0,1);
    ctx.font='bold 14px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#000'; ctx.fillText(t.txt, t.x-camX+1, t.y-camY+1);
    ctx.fillStyle=t.col; ctx.fillText(t.txt, t.x-camX, t.y-camY);
  }
  ctx.globalAlpha=1;
}

/* ============ HUD ============ */
function bar(x,y,w,h,per,c1,c2){
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle='#22283a'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=c1; ctx.fillRect(x,y,w*clamp(per,0,1),h);
  ctx.fillStyle=c2; ctx.fillRect(x,y,w*clamp(per,0,1),Math.max(1,h/3));
}

  };
  line('目标','护住怀中阿斗，杀出重围 800 里','#9fe8a0');
  line('走位','WASD / 方向键 移动（赵云自动向前冲）');
  line('突刺','空格 / 鼠标左键 龙胆突刺，撞开曹军');
  line('普攻','靠近敌人自动挥枪，拾取平安符回安危');
  line('大招','龙胆值满后 按 K → 七进七出，全屏连斩');
  line('失败','阿斗安危值归零，突围失败');
  ctx.font='12px "Microsoft YaHei",sans-serif';
  ctx.fillStyle='#8fa4c0';
  ctx.fillText('波次：步卒 → 刀斧手 / 弓手 → 骑兵，220 / 520 里遇名将', bx+16, y+2);
  ctx.fillText('最远纪录：'+best+' 里', bx+16, y+20);

  // 开始提示
  ctx.textAlign='center';
  ctx.save();
  ctx.globalAlpha=.65+0.35*Math.sin(time*4);
  ctx.font='bold 20px "Microsoft YaHei",sans-serif';
  ctx.fillStyle='#0d1017'; ctx.fillText('点击屏幕 或 按 空格 开始突围', W/2+2, 662);
  ctx.fillStyle='#ffe58a'; ctx.fillText('点击屏幕 或 按 空格 开始突围', W/2, 660);
  ctx.restore();
}
function panel(t1,t2,lines,col){
  ctx.fillStyle='rgba(6,8,14,.82)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.save();
  ctx.font='bold 40px "Microsoft YaHei",sans-serif';
  ctx.lineWidth=6; ctx.strokeStyle='#0d1017'; ctx.strokeText(t1, W/2, 250);
  ctx.fillStyle=col; ctx.fillText(t1, W/2, 250);
  ctx.restore();
  ctx.font='bold 16px "Microsoft YaHei",sans-serif';
  ctx.fillStyle='#cfe0f5'; ctx.fillText(t2, W/2, 284);
  ctx.font='15px "Microsoft YaHei",sans-serif';
  let y=340;
  for(const s of lines){ ctx.fillStyle='#dfe8f5'; ctx.fillText(s, W/2, y); y+=28; }
  ctx.save();
  ctx.globalAlpha=.65+0.35*Math.sin(time*4);
  ctx.font='bold 18px "Microsoft YaHei",sans-serif';
  ctx.fillStyle='#ffe58a'; ctx.fillText('按 空格 / 点击 返回封面', W/2, 596);
  ctx.restore();
}
function drawDead(){
  panel('阿斗被夺…','突围失败 · 长坂坡 '+Math.floor(distance)+' 里',[
    '斩敌 '+kills+' 人   最高连斩 x'+maxCombo,
    '最远纪录 '+best+' 里',
    '提示：多用突刺拉开距离，别被围在中间'
  ],'#ff6b5e');
}
function drawWin(){
  panel('杀出重围！','赵云怀抱幼主，七进七出全身而退',[
    '共突围 800 里   斩敌 '+kills+' 人',
    '最高连斩 x'+maxCombo+'   最远纪录 '+best+' 里',
    '子龙一身都是胆也！'
  ],'#9fe8a0');
}

/* ============ 渲染 ============ */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  if(state==='menu'){ drawMenu(); return; }
  const sx = shake>0? rnd(-shake,shake):0;
  const sy = shake>0? rnd(-shake,shake):0;
  ctx.save(); ctx.translate(sx,sy);
  drawGround();
  drawDecos();
  drawDrops();
  drawEnemies();
  drawBoss();
  // 箭
  for(const a of arrows){
    const x=a.x-camX, y=a.y-camY, ang=Math.atan2(a.vy,a.vx);
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    ctx.fillStyle='#d9c9a0'; ctx.fillRect(-11,-1,14,2);
    ctx.fillStyle='#f2f5fa';
    ctx.beginPath(); ctx.moveTo(4,-3); ctx.lineTo(10,0); ctx.lineTo(4,3); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  drawPlayer();
  drawParts();
  // 世界左右边界提示
  ctx.fillStyle='rgba(0,0,0,.25)';
  if(camX<2) ctx.fillRect(0,0,10-camX*3,H);
  if(camX>WORLD_W-W-2) ctx.fillRect(W-10+(WORLD_W-W-camX)*3,0,10,H);
  ctx.restore();

  drawHUD();
  if(flash>0){
    ctx.fillStyle='rgba(255,240,200,'+(flash*0.5)+')';
    ctx.fillRect(0,0,W,H);
  }
  // 新手提示
  if(time<6 && state==='play'){
    ctx.save(); ctx.globalAlpha=clamp(6-time,0,1);
    ctx.textAlign='center'; ctx.font='bold 14px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='rgba(8,10,18,.8)'; ctx.fillRect(W/2-160,H-96,320,30);
    ctx.fillStyle='#ffe58a'; ctx.fillText('WASD 走位 · 空格突刺 · 龙胆满按 K', W/2, H-76);
    ctx.restore();
  }
  if(state==='dead') drawDead();
  if(state==='win') drawWin();
}

/* ============ 主循环 ============ */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
reset();
state='menu';
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
