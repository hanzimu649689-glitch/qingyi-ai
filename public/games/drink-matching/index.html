<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>饮料配对计时赛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  html, body {
    width: 100%; height: 100%;
    background: #222;
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
  }
  #gameWrap {
    position: relative;
    width: 100%; height: 100%;
    max-width: 480px;
    background: #fff5e6;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: absolute; bottom: 8px; left: 0; width: 100%; text-align: center;
    color: #b08d55; font-size: 12px; pointer-events: none; opacity: 0.8;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>
  <div id="hint">点击两个饮料交换位置 · 把「已配对正确」个数凑满</div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const wrap = document.getElementById('gameWrap');
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  canvas.width = W * 2; canvas.height = H * 2;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(2, 0, 0, 2, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const DRINKS = [
  { id: 0, name: '可乐', c1: '#e63946', c2: '#fff', type: 'can', label: '可' },
  { id: 1, name: '雪碧', c1: '#2a9d8f', c2: '#fff', type: 'can', label: '雪' },
  { id: 2, name: '橙汁', c1: '#f4a261', c2: '#ffe8d6', type: 'bottle', label: '橙' },
  { id: 3, name: '奶茶', c1: '#8d5524', c2: '#eac086', type: 'bottle', label: '茶' },
  { id: 4, name: '能量', c1: '#22223b', c2: '#9a8c98', type: 'can', label: '能' },
  { id: 5, name: '苏打', c1: '#457b9d', c2: '#a8dadc', type: 'can', label: '苏' },
  { id: 6, name: '葡萄', c1: '#6a4c93', c2: '#cdb4db', type: 'bottle', label: '葡' },
  { id: 7, name: '柠檬', c1: '#e9c46a', c2: '#fff', type: 'can', label: '柠' }
];

const ROUNDS = [
  { n: 4, timeLimit: 20, name: '热身赛' },
  { n: 5, timeLimit: 30, name: '晋级赛' },
  { n: 6, timeLimit: 45, name: '挑战赛' },
  { n: 7, timeLimit: 60, name: '高手赛' },
  { n: 8, timeLimit: 75, name: '巅峰赛' }
];

let state = 'start'; // start, play, roundover, gameover, win
let round = 0;
let target = [];
let current = [];
let selected = null;
let startTime = 0;
let elapsed = 0;
let timerId = null;
let score = 0;
let moves = 0;
let stars = 0;
let particles = [];
let correctFlash = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newRound() {
  const r = ROUNDS[round];
  target = DRINKS.slice(0, r.n);
  do { current = shuffle(target); } while (isWin());
  selected = null;
  elapsed = 0;
  moves = 0;
  correctFlash = 0;
  startTime = Date.now();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => { elapsed = (Date.now() - startTime) / 1000; }, 50);
  state = 'play';
}

function isWin() {
  for (let i = 0; i < target.length; i++) if (current[i].id !== target[i].id) return false;
  return true;
}

function countCorrect() {
  let c = 0;
  for (let i = 0; i < target.length; i++) if (current[i].id === target[i].id) c++;
  return c;
}

function currentRowY() { return H * 0.46; }

function drinkRect(i, n, y, size) {
  const gap = 10;
  const total = n * size + (n - 1) * gap;
  const x = (W - total) / 2 + i * (size + gap);
  return { x, y, w: size, h: size };
}

function hitTest(ex, ey) {
  const n = current.length;
  const size = Math.min(72, (W - 40) / n - 10);
  const y = currentRowY();
  for (let i = 0; i < n; i++) {
    const r = drinkRect(i, n, y, size);
    if (ex >= r.x && ex <= r.x + r.w && ey >= r.y && ey <= r.y + r.h) return i;
  }
  return -1;
}

function pointerDown(ex, ey) {
  if (state !== 'play') return;
  const idx = hitTest(ex, ey);
  if (idx < 0) return;
  if (selected === null) { selected = idx; }
  else if (selected === idx) { selected = null; }
  else {
    const before = countCorrect();
    [current[selected], current[idx]] = [current[idx], current[selected]];
    moves++;
    selected = null;
    const after = countCorrect();
    if (after > before) correctFlash = 1;
    if (isWin()) finishRound(true);
  }
}

canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  pointerDown(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  pointerDown(t.clientX - rect.left, t.clientY - rect.top);
}, { passive: false });

function finishRound(success) {
  clearInterval(timerId);
  timerId = null;
  if (success) {
    const r = ROUNDS[round];
    const timeBonus = Math.max(0, Math.floor((r.timeLimit - elapsed) * 10));
    const moveBonus = Math.max(0, 100 - moves * 5);
    const roundScore = 500 + timeBonus + moveBonus;
    score += roundScore;
    stars += elapsed <= r.timeLimit * 0.5 ? 3 : elapsed <= r.timeLimit * 0.8 ? 2 : 1;
    spawnConfetti();
    state = 'roundover';
  } else {
    state = 'gameover';
  }
}

function spawnConfetti() {
  particles = [];
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H - H,
      vx: (Math.random() - 0.5) * 6, vy: Math.random() * 4 + 2,
      c: ['#e63946', '#2a9d8f', '#f4a261', '#e9c46a', '#9b5de5'][Math.floor(Math.random() * 5)],
      s: Math.random() * 6 + 3, r: Math.random() * Math.PI
    });
  }
}

function startGame() {
  round = 0; score = 0; stars = 0; particles = [];
  newRound();
}

function nextRound() {
  round++;
  if (round >= ROUNDS.length) state = 'win';
  else newRound();
}

function rectClick(ex, ey, x, y, w, h) {
  return ex >= x && ex <= x + w && ey >= y && ey <= y + h;
}

function handleClick(ex, ey) {
  if (state === 'start') {
    startGame();
  } else if (state === 'roundover') {
    nextRound();
  } else if (state === 'gameover' || state === 'win') {
    state = 'start';
  }
}

canvas.addEventListener('mousedown', e => {
  if (state !== 'play') {
    const rect = canvas.getBoundingClientRect();
    handleClick(e.clientX - rect.left, e.clientY - rect.top);
  }
});
canvas.addEventListener('touchstart', e => {
  if (state !== 'play') {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const t = e.touches[0];
    handleClick(t.clientX - rect.left, t.clientY - rect.top);
  }
}, { passive: false });

function drawRoundedRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke(); }
}

function drawPixelText(text, x, y, size, color, align) {
  ctx.font = `bold ${size}px "Microsoft YaHei", sans-serif`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color || '#333';
  ctx.fillText(text, x, y);
}

function drawDrink(d, x, y, size, selected) {
  const pad = 4;
  const cx = x + size / 2, cy = y + size / 2;
  ctx.save();
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(cx + 4, y + size - 4, size * 0.38, size * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  // container bg
  drawRoundedRect(x + pad, y + pad, size - pad * 2, size - pad * 2, 10, '#fff', selected ? '#ff6b6b' : '#e0e0e0');
  // drink body
  if (d.type === 'can') {
    const bw = size * 0.55, bh = size * 0.7;
    ctx.fillStyle = d.c1;
    drawRoundedRect(cx - bw / 2, cy - bh / 2 + 4, bw, bh, 6, d.c1, null);
    ctx.fillStyle = d.c2;
    ctx.fillRect(cx - bw / 2, cy - 4, bw, 8);
    drawPixelText(d.label, cx, cy - 2, size * 0.22, '#fff');
    // can top
    ctx.fillStyle = '#bbb';
    ctx.beginPath(); ctx.ellipse(cx, cy - bh / 2 + 4, bw / 2, 4, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    const bw = size * 0.45, bh = size * 0.7;
    ctx.fillStyle = d.c1;
    drawRoundedRect(cx - bw / 2, cy - bh / 2 + 6, bw, bh, 8, d.c1, null);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(cx - bw / 4, cy - bh / 4, bw / 5, bh / 2);
    // cap
    ctx.fillStyle = d.c2;
    ctx.beginPath(); ctx.ellipse(cx, cy - bh / 2 + 6, bw / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
    drawPixelText(d.label, cx, cy, size * 0.2, '#fff');
  }
  ctx.restore();
}

function drawQGirl(x, y, scale, happy) {
  ctx.save();
  const bh = 1.1 + Math.sin(Date.now() / 250) * 0.03;
  ctx.translate(x, y);
  ctx.scale(scale * bh, scale);
  // hair back
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath(); ctx.arc(60, 60, 58, 0, Math.PI * 2); ctx.fill();
  // face
  ctx.fillStyle = '#ffe4d6';
  ctx.beginPath(); ctx.arc(60, 65, 40, 0, Math.PI * 2); ctx.fill();
  // bangs
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath(); ctx.arc(60, 42, 38, Math.PI, 0); ctx.fill();
  // eyes
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(45, 62, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(75, 62, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(47, 60, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(77, 60, 2, 0, Math.PI * 2); ctx.fill();
  // blush
  ctx.fillStyle = 'rgba(255,120,120,0.35)';
  ctx.beginPath(); ctx.arc(38, 74, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(82, 74, 6, 0, Math.PI * 2); ctx.fill();
  // mouth
  ctx.strokeStyle = '#a55';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  if (happy) ctx.arc(60, 78, 8, 0.1, Math.PI - 0.1);
  else ctx.arc(60, 84, 5, Math.PI + 0.2, -0.2);
  ctx.stroke();
  // hair buns
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath(); ctx.arc(22, 32, 14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(98, 32, 14, 0, Math.PI * 2); ctx.fill();
  // body
  ctx.fillStyle = '#ff85a2';
  drawRoundedRect(35, 102, 50, 40, 12, '#ff85a2', null);
  // collar
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(50, 102); ctx.lineTo(70, 102); ctx.lineTo(60, 115); ctx.closePath(); ctx.fill();
  // arms
  ctx.fillStyle = '#ffe4d6';
  drawRoundedRect(18, 108, 16, 28, 8, '#ffe4d6', null);
  drawRoundedRect(86, 108, 16, 28, 8, '#ffe4d6', null);
  // drink in hand
  ctx.fillStyle = '#e63946';
  drawRoundedRect(88, 95, 14, 26, 4, '#e63946', null);
  ctx.fillStyle = '#fff'; ctx.fillRect(88, 104, 14, 5);
  ctx.fillStyle = '#ccc';
  ctx.beginPath(); ctx.ellipse(95, 95, 7, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawTimer() {
  const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
  const sec = Math.floor(elapsed % 60).toString().padStart(2, '0');
  const ms = Math.floor((elapsed % 1) * 100).toString().padStart(2, '0');
  const txt = `${min}:${sec}:${ms}`;
  const w = 180, h = 56, x = (W - w) / 2, y = 80;
  drawRoundedRect(x, y, w, h, 10, '#111827', '#374151');
  ctx.font = 'bold 32px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#34d399';
  ctx.shadowColor = '#34d399'; ctx.shadowBlur = 10;
  ctx.fillText(txt, W / 2, y + h / 2);
  ctx.shadowBlur = 0;
}

function drawHeader() {
  ctx.fillStyle = '#8b5a2b';
  ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('饮料配对计时赛', W / 2, 38);
  // round badge
  const r = ROUNDS[round];
  ctx.fillStyle = '#ff85a2';
  ctx.beginPath(); ctx.arc(40, 40, 22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px "Microsoft YaHei", sans-serif';
  ctx.fillText(`R${round + 1}`, 40, 36);
  ctx.font = '10px "Microsoft YaHei", sans-serif';
  ctx.fillText(r.name, 40, 50);
  // score
  ctx.fillStyle = '#5d4037';
  ctx.font = 'bold 14px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`得分 ${score}`, W - 16, 36);
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.fillText(`星星 ${stars}⭐`, W - 16, 54);
}

function drawRow(label, drinks, y, selectable) {
  const n = drinks.length;
  const size = Math.min(68, (W - 48) / n - 10);
  ctx.fillStyle = '#8b5a2b';
  ctx.font = 'bold 14px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(label, W / 2, y - 10);
  for (let i = 0; i < n; i++) {
    const r = drinkRect(i, n, y, size);
    const sel = selectable && selected === i;
    if (sel) {
      ctx.fillStyle = 'rgba(255,107,107,0.25)';
      drawRoundedRect(r.x - 6, r.y - 6, r.w + 12, r.h + 12, 14, null, '#ff6b6b');
    }
    drawDrink(drinks[i], r.x, r.y, r.w, sel);
  }
}

function drawButton(x, y, w, h, text, color) {
  drawRoundedRect(x, y, w, h, 16, color || '#ff6b6b', null);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + h / 2);
}

function drawConfetti() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.r += 0.1;
    ctx.fillStyle = p.c;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
    ctx.restore();
    if (p.y > H) particles.splice(i, 1);
  }
}

function drawStartScreen() {
  ctx.fillStyle = '#fff5e6'; ctx.fillRect(0, 0, W, H);
  drawPixelText('饮料配对计时赛', W / 2, H * 0.18, 32, '#5d4037');
  drawQGirl(W / 2, H * 0.42, 1.6, true);
  drawPixelText('顺序会藏起来 · 看你能对几个', W / 2, H * 0.66, 15, '#8b5a2b');
  drawButton((W - 180) / 2, H * 0.74, 180, 52, '开始挑战', '#ff6b6b');
  drawPixelText('共 5 轮 · 越来越难', W / 2, H * 0.88, 13, '#a1887f');
}

function drawCorrectBadge(n, total) {
  const w = 200, h = 64, x = (W - w) / 2, y = H * 0.26;
  const all = n === total;
  const sc = 1 + correctFlash * 0.08;
  ctx.save();
  ctx.translate(W / 2, y + h / 2);
  ctx.scale(sc, sc);
  ctx.translate(-W / 2, -(y + h / 2));
  drawRoundedRect(x, y, w, h, 16, all ? '#2a9d8f' : '#ff85a2', null);
  if (correctFlash > 0.01) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(all ? '全部配对完成！' : '已配对正确', W / 2, y + 20);
  ctx.font = 'bold 30px "Microsoft YaHei", sans-serif';
  ctx.fillText(`${n} / ${total}`, W / 2, y + 46);
  ctx.restore();
}

function drawPlayScreen() {
  ctx.fillStyle = '#fff5e6'; ctx.fillRect(0, 0, W, H);
  drawHeader();
  drawTimer();
  drawCorrectBadge(countCorrect(), current.length);
  drawRow('点击交换 · 猜对顺序', current, currentRowY(), true);
  drawQGirl(W * 0.82, H * 0.80, 0.7, true);
  const r = ROUNDS[round];
  const remain = Math.max(0, r.timeLimit - elapsed);
  ctx.fillStyle = remain < 10 ? '#e63946' : '#8b5a2b';
  ctx.font = '12px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`剩余 ${remain.toFixed(1)}s · 步数 ${moves}`, W / 2, H - 28);
}

function drawRoundOver() {
  drawPlayScreen();
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
  drawRoundedRect((W - 280) / 2, H * 0.28, 280, 220, 20, '#fff', null);
  drawPixelText('配对成功！', W / 2, H * 0.36, 26, '#2a9d8f');
  const r = ROUNDS[round];
  const star = elapsed <= r.timeLimit * 0.5 ? '⭐⭐⭐' : elapsed <= r.timeLimit * 0.8 ? '⭐⭐' : '⭐';
  drawPixelText(star, W / 2, H * 0.43, 28, '#f4a261');
  drawPixelText(`用时 ${elapsed.toFixed(2)}s`, W / 2, H * 0.52, 15, '#555');
  drawPixelText(`本关得分 ${Math.floor(Math.max(0, 500 + (r.timeLimit - elapsed) * 10 + Math.max(0, 100 - moves * 5)))}`, W / 2, H * 0.58, 14, '#555');
  drawButton((W - 180) / 2, H * 0.63, 180, 48, round < ROUNDS.length - 1 ? '下一关' : '看结果', '#2a9d8f');
  drawConfetti();
}

function drawGameOver() {
  drawPlayScreen();
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
  drawRoundedRect((W - 280) / 2, H * 0.30, 280, 180, 20, '#fff', null);
  drawPixelText('时间到！', W / 2, H * 0.38, 26, '#e63946');
  drawQGirl(W / 2, H * 0.48, 0.9, false);
  drawPixelText(`最终得分 ${Math.floor(score)}`, W / 2, H * 0.58, 15, '#555');
  drawButton((W - 160) / 2, H * 0.64, 160, 44, '再玩一次', '#e63946');
}

function drawWin() {
  ctx.fillStyle = '#fff5e6'; ctx.fillRect(0, 0, W, H);
  drawPixelText('挑战完成！', W / 2, H * 0.18, 32, '#5d4037');
  drawQGirl(W / 2, H * 0.40, 1.4, true);
  drawPixelText(`总得分 ${Math.floor(score)}`, W / 2, H * 0.64, 20, '#5d4037');
  drawPixelText(`累计星星 ${stars}⭐`, W / 2, H * 0.70, 18, '#f4a261');
  drawButton((W - 180) / 2, H * 0.78, 180, 50, '再玩一次', '#ff6b6b');
  drawConfetti();
}

function loop() {
  if (correctFlash > 0) correctFlash = Math.max(0, correctFlash - 0.05);
  if (state === 'play') {
    const r = ROUNDS[round];
    if (elapsed >= r.timeLimit) finishRound(false);
  }
  if (state === 'start') drawStartScreen();
  else if (state === 'play') drawPlayScreen();
  else if (state === 'roundover') drawRoundOver();
  else if (state === 'gameover') drawGameOver();
  else if (state === 'win') drawWin();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
